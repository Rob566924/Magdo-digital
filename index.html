<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crisis en la Justicia Digital</title><style>body{font-family:Segoe UI,sans-serif;background:#eef5ff;margin:0;padding:20px}#reto{max-width:900px;margin:auto;background:#fff;border:3px solid #0b1f4d;border-radius:20px;overflow:hidden}.hd{background:linear-gradient(90deg,#0b1f4d,#2563eb);color:#fff;padding:15px;display:flex;justify-content:space-between}.bd{padding:20px}.bar{height:14px;background:#dbe7ff;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%}.c{i}.conf{background:#2563eb}.seg{background:#16a34a}.efi{background:#f59e0b}.panel{border:2px solid #c9dcff;border-radius:15px;padding:15px;margin-top:15px}.btn{display:block;width:100%;margin:8px 0;padding:12px;border:2px solid #bfd4ff;background:#edf3ff;border-radius:10px;cursor:pointer}.fb{margin-top:10px;padding:10px;border-radius:10px;display:none}.ok{display:block;background:#e8f8ed}.ko{display:block;background:#fdeaea}.hide{display:none}</style></head><body><div id="reto"><div class="hd"><div><b>🏛️ Crisis en la Justicia Digital</b><br>Magistrado Digital</div><div>⭐ <span id="pts">0</span></div></div><div class="bd" id="game"><p>Toma decisiones estratégicas para mantener el equilibrio institucional.</p><div>⚖️ Confianza<div class="bar"><i id="conf" class="conf" style="width:66%"></i></div></div><div>🛡️ Seguridad<div class="bar"><i id="seg" class="seg" style="width:66%"></i></div></div><div>🚀 Eficiencia<div class="bar"><i id="efi" class="efi" style="width:66%"></i></div></div><div class="panel"><h3 id="tit"></h3><p id="txt"></p><div id="ops"></div><div id="fb" class="fb"></div></div></div><div id="end" class="bd hide"><h1 id="med">🏛️</h1><h2 id="ran"></h2><h3><span id="fpts"></span> puntos</h3><p id="msg"></p><button class="btn" onclick="location.reload()">Reintentar</button></div></div><script>const ev=[{t:'Error IA',d:'La IA clasificó mal expedientes',o:[['Suspender IA',5,10,-25,0],['Sin revisión',-25,-25,5,0],['Supervisión humana',15,15,10,1]]},{t:'Phishing',d:'Correos maliciosos detectados',o:[['Ignorar',-20,-25,0,0],['Alerta y capacitación',10,20,5,1],['Reiniciar equipos',-10,5,-5,0]]},{t:'Archivo saturado',d:'Demasiado papel',o:[['Más archiveros',0,0,-15,0],['Gestión documental digital',10,5,20,1],['Limitar asuntos',-15,0,-10,0]]},{t:'Portal caído',d:'Ciudadanía sin servicio',o:[['Esperar',-20,0,-15,0],['Contingencia',20,5,10,1],['Cerrar servicios',-15,10,-20,0]]},{t:'Datos reservados',d:'Solicitud urgente de acceso',o:[['Compartir',-25,-30,5,0],['Controles y trazabilidad',10,20,5,1],['Negar todo',-5,10,-10,0]]},{t:'Plan 3 años',d:'Definir estrategia digital',o:[['Seguir igual',-10,0,-15,0],['Innovación e IA responsable',20,15,20,1],['Comprar tecnología sin plan',-10,-5,5,0]]}];let p=0,i=0,c=100,s=100,e=100,lock=false;function lim(v){return Math.max(0,Math.min(150,v))}function bars(){conf.style.width=(c/150*100)+'%';seg.style.width=(s/150*100)+'%';efi.style.width=(e/150*100)+'%';}function load(){let x=ev[i];tit.textContent=x.t;txt.textContent=x.d;ops.innerHTML='';x.o.forEach(a=>{let b=document.createElement('button');b.className='btn';b.textContent=a[0];b.onclick=()=>res(a);ops.appendChild(b);});}function res(a){if(lock)return;lock=true;c=lim(c+a[1]);s=lim(s+a[2]);e=lim(e+a[3]);p+=a[4]?150:50;pts.textContent=p;bars();fb.className='fb '+(a[4]?'ok':'ko');fb.style.display='block';fb.innerHTML=a[4]?'✅ Decisión estratégica acertada':'⚠️ Consecuencias institucionales';setTimeout(()=>{lock=false;i++;fb.style.display='none';if(i<ev.length)load();else fin();},1800);}function fin(){game.classList.add('hide');end.classList.remove('hide');let ind=Math.round((c+s+e)/3),r,m;if(ind>=130){r='MAGISTRADO DIGITAL';m='🏛️';}else if(ind>=110){r='LÍDER DE TRANSFORMACIÓN';m='🛡️';}else if(ind>=90){r='GESTOR ESTRATÉGICO';m='⚖️';}else{r='ASPIRANTE DIGITAL';m='🔰';}med.textContent=m;ran.textContent=r;fpts.textContent=p;msg.textContent='Índice institucional: '+ind;}bars();load();</script></body></html>
